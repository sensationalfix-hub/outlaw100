name: verify

on:
  push:
    branches: [main, fix/media-proxy-rockstar]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-publishable-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Unit tests
        run: find tests/unit -name '*.test.ts' -print0 | xargs -0 node --experimental-strip-types --test
      - name: Canonical catalog audit
        run: npm run audit:data
      - name: Source-independent Python tests
        run: python3 -m unittest tests.python.test_catalog_import_migration tests.python.test_milestone_progress_migration tests.python.test_performance_hardening_migration tests.python.test_progress_import_migration tests.python.test_progress_rpc_migration tests.python.test_security_hardening_migration tests.python.test_supabase_schema
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
