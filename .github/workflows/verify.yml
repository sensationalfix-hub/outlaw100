name: verify

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-publishable-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Public unit tests
        run: find tests/unit -name '*.test.ts' ! -name 'catalog-audit.test.ts' -print0 | xargs -0 node --experimental-strip-types --test
      - name: Python tests
        run: npm run test:python
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
