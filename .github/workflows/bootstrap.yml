name: materialize-source

on:
  push:
    branches: [main]
    paths:
      - 'bootstrap.py'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ !contains(github.event.head_commit.message || '', 'materialize OUTLAW100 source') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize repository
        run: python3 bootstrap.py
      - name: Commit canonical source tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: materialize OUTLAW100 source"
          git push
