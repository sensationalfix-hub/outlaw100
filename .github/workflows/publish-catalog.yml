name: publish-canonical-catalog

on:
  push:
    branches: [main]
    paths:
      - catalog-upload/catalog.json.xz

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Validate and materialize canonical catalog
        shell: bash
        run: |
          set -euo pipefail
          echo '01edcb1852351cef5b5690a626d8860e2ed453a0a0ad4bf6271242759a0fd29b  catalog-upload/catalog.json.xz' | sha256sum -c -
          xz -dc catalog-upload/catalog.json.xz > /tmp/catalog.json
          echo 'deabfa7266915e8f06ec2706d6b0da810bd032f5beb63bfe31b3fa603bb4f473  /tmp/catalog.json' | sha256sum -c -
          python3 - <<'PY'
          import json
          p=json.load(open('/tmp/catalog.json'))
          assert len(p['entities']) == 2228
          assert len(p['criteria']) == 3067
          assert len(p['relations']) == 378
          assert len(p['recipes']) == 147
          assert len(p['milestones']) == 271
          assert len(p['milestoneTasks']) == 1761
          assert len(p['archiveEntries']) == 1543
          assert len(p['sourceReferences']) == 5529
          assert p['audit']['hasAmericanVenom'] is True
          PY
          mkdir -p data/generated public/data
          cp /tmp/catalog.json data/generated/catalog.json
          cp /tmp/catalog.json public/data/catalog.json
      - name: Commit verified catalog
        shell: bash
        run: |
          set -euo pipefail
          rm -rf catalog-upload
          rm -f .github/workflows/publish-catalog.yml
          git config user.name 'OUTLAW100 catalog bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'data: publish verified canonical catalog'
          git push
